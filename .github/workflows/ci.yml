name: Terminalis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (modo offline para os testes)
        env:
          TERMINALIS_OFFLINE: "1"
        run: npm run build
      - name: Test engine and content
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser
        run: npm run test:browser

